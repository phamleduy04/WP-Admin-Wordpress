name: Build and Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate store credentials without submitting'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install

      - name: Build Chrome extension
        run: pnpm run build

      - name: Build Firefox extension
        run: pnpm run build:firefox

      - name: Create Chrome ZIP
        run: pnpm run zip

      - name: Create Firefox ZIP
        run: pnpm run zip:firefox

      - name: Get version from wxt.config.ts
        id: get_version
        run: |
          VERSION=$(grep -o "version: '[0-9]\+\(\.[0-9]\+\)*'" wxt.config.ts | grep -o "[0-9]\+\(\.[0-9]\+\)*")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ steps.get_version.outputs.VERSION }}
          doNotFailIfNotFound: true

      - name: Create Release
        id: create_release
        if: steps.check_release.outputs.id == ''
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-chrome.zip
            .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Chrome Web Store and Firefox Add-ons
        if: steps.check_release.outputs.id == '' || inputs.dry_run
        run: |
          pnpm wxt submit ${{ inputs.dry_run && '--dry-run' || '' }} \
            --chrome-zip .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-chrome.zip \
            --firefox-zip .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-firefox.zip \
            --firefox-sources-zip .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-sources.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
