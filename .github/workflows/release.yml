name: Build and Release Extension

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate store credentials without submitting'
        type: boolean
        default: false

permissions:
  contents: write

# Queue releases so each run bumps from the latest version on main
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Bump patch version if the current one is already released
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$(bun -p "require('./package.json').version")" >/dev/null 2>&1; then
            bun pm version patch --no-git-tag-version
            VERSION=$(bun -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: release $VERSION"
            git push
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome extension
        run: bun run build

      - name: Build Firefox extension
        run: bun run build:firefox

      - name: Create Chrome ZIP
        run: bun run zip

      - name: Create Firefox ZIP
        run: bun run zip:firefox

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(bun -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ steps.get_version.outputs.VERSION }}
          doNotFailIfNotFound: true

      - name: Create Release
        id: create_release
        if: steps.check_release.outputs.id == ''
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-chrome.zip
            .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Chrome Web Store and Firefox Add-ons
        if: steps.check_release.outputs.id == '' || inputs.dry_run
        run: |
          bun --bun wxt submit ${{ inputs.dry_run && '--dry-run' || '' }} \
            --chrome-zip .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-chrome.zip \
            --firefox-zip .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-firefox.zip \
            --firefox-sources-zip .output/wp-admin-wordpress-${{ steps.get_version.outputs.VERSION }}-sources.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
