name: PR Build

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome extension
        run: bun run build

      - name: Build Firefox extension
        run: bun run build:firefox

      - name: Upload Chrome build
        id: chrome
        uses: actions/upload-artifact@v7
        with:
          name: chrome-pr-${{ github.event.pull_request.number }}
          path: .output/chrome-mv3/
          retention-days: 14

      - name: Upload Firefox build
        id: firefox
        uses: actions/upload-artifact@v7
        with:
          name: firefox-pr-${{ github.event.pull_request.number }}
          path: .output/firefox-mv2/
          retention-days: 14

      - name: Comment build links on PR
        # Fork PRs get a read-only token and cannot comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --edit-last --create-if-none --body "**Test builds** for ${{ github.event.pull_request.head.sha }}

          - [Chrome](${{ steps.chrome.outputs.artifact-url }}): unzip, then Load unpacked in \`chrome://extensions\`
          - [Firefox](${{ steps.firefox.outputs.artifact-url }}): unzip, then Load Temporary Add-on in \`about:debugging#/runtime/this-firefox\` and pick \`manifest.json\`

          Links expire after 14 days."
